# ---------------------------------------------------------------------------
# Odibrick — Nginx site configuration
#
# One public entry point. Nginx terminates TLS and splits traffic:
#   /api/*  -> NestJS on 127.0.0.1:4000
#   /*      -> Next.js on 127.0.0.1:3000
#
# Because both apps sit on the same origin, the session cookie is first-party
# and no CORS pre-flight is needed in the browser.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/odibrick
#   sudo ln -s /etc/nginx/sites-available/odibrick /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ---------------------------------------------------------------------------

# Rate limit buckets. Auth is stricter because it is the endpoint worth
# brute-forcing; the API limiter is a backstop behind the app's own throttler.
limit_req_zone $binary_remote_addr zone=odibrick_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=odibrick_auth:10m rate=5r/m;

upstream odibrick_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

upstream odibrick_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name odibrick.com www.odibrick.com;

    # Certbot writes its challenge here; everything else goes to TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://odibrick.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.odibrick.com;

    ssl_certificate     /etc/letsencrypt/live/odibrick.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/odibrick.com/privkey.pem;

    return 301 https://odibrick.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name odibrick.com;

    # ----------------------------------------------------------------- TLS
    ssl_certificate     /etc/letsencrypt/live/odibrick.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/odibrick.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ------------------------------------------------------------- headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(self), microphone=(self), geolocation=(self), payment=(self)" always;

    # Tight enough to be worth having. Widen script-src only if you add a
    # third-party SDK, and prefer a nonce over 'unsafe-inline' when you do.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    server_tokens off;
    client_max_body_size 25M;      # inspection photos and KYC scans
    client_body_timeout  60s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    access_log /var/log/nginx/odibrick.access.log;
    error_log  /var/log/nginx/odibrick.error.log warn;

    # ----------------------------------------------------------------- API
    location /api/auth/ {
        limit_req zone=odibrick_auth burst=10 nodelay;
        proxy_pass http://odibrick_api;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Host              $host;
    }

    location /api/ {
        limit_req zone=odibrick_api burst=60 nodelay;
        proxy_pass http://odibrick_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Host              $host;
        proxy_read_timeout 60s;
        proxy_buffering off;              # streaming downloads from the vault
    }

    # ------------------------------------------------------------ Next.js
    location /_next/static/ {
        proxy_pass http://odibrick_web;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://odibrick_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Host              $host;
        proxy_read_timeout 60s;
    }

    # The health endpoint should not fill the access log.
    location = /api/health {
        access_log off;
        proxy_pass http://odibrick_api;
        proxy_set_header Host $host;
    }
}
